global:
  scrape_interval: 5s  # Kitni baar data collect karna hai

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:9091'

  - job_name: 'mysql-exporter'
    static_configs:
      - targets:
          - 'mysql-exporter:9104'
