version: 0.0  
os: linux  
files:  
  - source: app.jar  
    destination: /home/ubuntu/app  
permissions:  
  - object: /home/ubuntu/app  
    pattern: "**"  
    owner: ubuntu  
    group: ubuntu  
hooks:  
  ApplicationStop:  
    - location: scripts/stop.sh  
      timeout: 60  
      runas: ubuntu  
  BeforeInstall:  
    - location: scripts/install_dependencies.sh  
      timeout: 300  
      runas: ubuntu  
  ApplicationStart:  
    - location: scripts/start.sh  
      timeout: 60  
      runas: ubuntu  
