spring.application.name=E-Commers_RestAPIs
server.port=9091
server.url=http://localhost:9091


# MySQL Database Configuration (Docker Container Ke Saath)
spring.datasource.url=jdbc:mysql://localhost:3306/ecommersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=1111-3333-ABCD-5555-8888-#56&*
jwt.token.expiration=10000

# Springdoc API Docs Path
springdoc.api-docs.path=/api-docs

# Actuator endpoints expose karna
management.endpoints.web.exposure.include=*

# Health endpoint ke details dikhane ke liye
management.endpoint.health.show-details=always

# Metrics ke liye required settings
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.http=true

# Prometheus ke liye metrics export enable karna
management.metrics.export.prometheus.enabled=true



